# Render Blueprint (https://render.com/docs/blueprint-spec).
# New -> Blueprint -> pick this repo, or create a Static Site by hand with the
# same three settings: build `npm ci && npm run build`, publish `dist`, and the
# VITE_API_BASE environment variable below.
services:
  - type: web
    name: researchgatefe
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://research-gate-be.vercel.app   # the ResearchGateBE deployment, no trailing slash
    routes:
      - type: rewrite        # SPA: every path serves index.html
        source: /*
        destination: /index.html
